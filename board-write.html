<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Momentrip Wireframe - Board Write</title>
<link rel="stylesheet" href="css/wireframe.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<!-- ==========================================================================
     HEADER (index.html / board-list.html / board-view.html과 동일)
     ========================================================================== -->
<header class="site-header">
  <div class="container header-inner">
    <button type="button" class="gnb-toggle" aria-label="메뉴 열기"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>

    <div class="logo-area">
      <a href="index.html" class="logo-box"><img src="assets/momentrip-logo-primary.svg" alt="MOMENTRIP" class="site-logo"></a>
    </div>

    <nav class="gnb">
      <a href="index.html">둘러보기</a>
      <a href="#">클래스·체험</a>
      <a href="#">지역행사</a>
      <a href="board-list.html" class="is-active">커뮤니티</a>
    </nav>

    <div class="header-utils">
      <button type="button" class="region-select">
        <i class="fa-solid fa-location-dot" aria-hidden="true"></i>
        <span class="util-label">지역 선택</span>
      </button>
      <button type="button" class="util-btn util-search">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <span class="util-label">검색</span>
      </button>
      <a href="board-login.html" class="util-btn util-login">
        <i class="fa-solid fa-user" aria-hidden="true"></i>
        <span class="util-label">로그인</span>
      </a>
    </div>
  </div>
</header>

<main>

  <!-- ==========================================================================
       BOARD WRITE
       board-view와 동일한 디자인 시스템(spacing/typography/border/버튼/입력
       요소)을 재사용한다. 지역/위치/제목/내용/이미지/동영상/태그는 모두
       .write-stage(960px) 안에서 같은 시작선/끝선을 공유한다.
       ========================================================================== -->
  <section class="page-section board-write-section">
    <div class="container">
     <div class="write-stage">

      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="index.html">홈</a>
        <span>/</span>
        <a href="board-list.html">커뮤니티</a>
        <span>/</span>
        <span class="current">글쓰기</span>
      </nav>

      <header class="write-header">
        <h1 class="write-title">글쓰기</h1>
        <p class="write-desc">동네 사람들과 나누고 싶은 이야기를 자유롭게 남겨보세요</p>
      </header>

      <form class="write-form">

        <div class="field">
          <label class="field-label">카테고리</label>
          <div class="category-chip-group">
            <label class="category-chip">
              <input class="hidden-input" type="radio" name="category" checked>
              <span class="chip-title">후기</span>
              <span class="chip-desc">경험을 공유해요</span>
            </label>
            <label class="category-chip">
              <input class="hidden-input" type="radio" name="category">
              <span class="chip-title">질문</span>
              <span class="chip-desc">궁금한 것을 물어봐요</span>
            </label>
            <label class="category-chip">
              <input class="hidden-input" type="radio" name="category">
              <span class="chip-title">정보공유</span>
              <span class="chip-desc">좋은 정보를 알려줘요</span>
            </label>
            <label class="category-chip">
              <input class="hidden-input" type="radio" name="category">
              <span class="chip-title">동행모집</span>
              <span class="chip-desc">같이 갈 사람을 찾아요</span>
            </label>
            <label class="category-chip">
              <input class="hidden-input" type="radio" name="category">
              <span class="chip-title">행사후기</span>
              <span class="chip-desc">행사 경험을 남겨요</span>
            </label>
          </div>
        </div>

        <div class="write-row-location">
          <div class="field">
            <label class="field-label">지역</label>
            <select class="input-select">
              <option>지역 선택</option>
              <option>서울 성동구</option>
              <option>서울 마포구</option>
              <option>서울 용산구</option>
              <option>서울 광진구</option>
            </select>
          </div>

          <div class="field">
            <label class="field-label">위치</label>
            <input type="text" class="input-text" placeholder="장소를 검색해주세요">
          </div>
        </div>

        <div class="field">
          <label class="field-label">제목</label>
          <input type="text" class="input-text" placeholder="제목을 입력해주세요">
        </div>

        <div class="field">
          <label class="field-label">내용</label>
          <textarea class="input-textarea" placeholder="이야기를 자유롭게 남겨주세요"></textarea>
        </div>

        <div class="write-row-media">
          <div class="field">
            <label class="field-label">이미지 첨부</label>
            <div class="upload-box"><i class="fa-solid fa-image" aria-hidden="true"></i> 이미지 추가</div>
            <p class="field-hint">최대 5장까지 첨부할 수 있습니다 (와이어프레임 단계)</p>
          </div>

          <div class="field">
            <label class="field-label">동영상 첨부</label>
            <div class="upload-box"><i class="fa-solid fa-video" aria-hidden="true"></i> 동영상 추가</div>
            <p class="field-hint">최대 3개까지 첨부할 수 있습니다 (와이어프레임 단계)</p>
          </div>
        </div>

        <div class="field">
          <label class="field-label">태그</label>
          <input type="text" class="input-text" placeholder="태그를 입력하세요">
          <p class="field-hint">예) #카페 #데이트 #아이와함께 #주차가능</p>
        </div>

        <div class="form-actions">
          <a href="board-list.html" class="btn btn-lg">취소</a>
          <button type="submit" class="btn btn-fill btn-lg">등록</button>
        </div>

      </form>

     </div>
    </div>
  </section>

</main>

<!-- ==========================================================================
     FOOTER (index.html / board-list.html / board-view.html과 동일)
     ========================================================================== -->
<footer class="site-footer">
  <div class="container">
    <div class="footer-top">
      <div class="logo-box"><img src="assets/momentrip-logo-primary.svg" alt="MOMENTRIP" class="site-logo"></div>
      <nav class="footer-links">
        <a href="#">서비스 소개</a>
        <a href="#">이용약관</a>
        <a href="#">개인정보처리방침</a>
        <a href="#">문의하기</a>
      </nav>
    </div>
    <p class="footer-copy">Copyright &copy; Momentrip. All rights reserved.</p>
  </div>
</footer>

</body>
</html>
